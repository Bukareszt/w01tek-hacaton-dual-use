# Bind-mounts this experiment into the running wojtek_robot container without
# editing ros/docker/compose.yaml (D-02). Invoked from ros/docker/ as:
#   docker compose -f compose.yaml \
#                   -f ../../experiments/wojtek_rai_v1/docker/compose.override.yaml \
#                   up -d
# (see run.sh's `container` target). Docker Compose resolves every relative
# path in a multi-file stack against the directory of the FIRST -f file, not
# this file's own directory -- so from ros/docker/, `../../experiments/
# wojtek_rai_v1` is exactly experiments/wojtek_rai_v1/. Writing `../` here
# would silently bind-mount ros/ itself into the container instead; verify
# with `docker compose ... config` before trusting a change to this path.
#
# This is a bind mount of a directory that already exists on the host, not a
# named volume, so it survives container recreation: the RAI venv, uv cache
# and colcon overlay built inside the container (D-03) all live under this
# same mount and persist across `up`/`down` cycles exactly like ros/src does
# for the production packages. Without this mount, nothing under
# experiments/wojtek_rai_v1 is visible inside the container -- run.sh's
# install/build/agent-topics targets would fail immediately with "No such
# file or directory".
#
# No `environment:` block here on purpose (D-04): ROS_DOMAIN_ID,
# RMW_IMPLEMENTATION and CYCLONEDDS_URI are inherited unmodified from the
# base wojtek_robot service. Redeclaring any of them here would risk
# silently diverging this experiment's DDS domain from the simulation it
# needs to discover topics on.
#
# Second mount, read-only: the repo-root .env.example, at
# /ros2_ws/.env.example. Plan 01-03 / FOUND-04 requires a model-free test
# (tests/test_no_secrets_in_config.py) to scan this file for secret-shaped
# values, but only this experiment's own directory (above) and ros/src are
# otherwise visible inside the container -- the repository's .git and its
# root files, including .env.example, are not part of either mount. This
# one file is safe to expose: it is already public, committed, tracked
# content that by design carries placeholder names only, never a real
# value, and the mount is read-only so nothing inside the container can
# edit the host's tracked copy.
#
# Third mount, read-write: the entire repository root, at /ros2_ws/repo_root.
# [Rule 2/3 deviation, plan 01-04] FOUND-01's guard test
# (tests/test_isolation_boundary.py) has to scan ros/, training/ and the
# repository's top-level shell entry points for a reference to this
# experiment's name, and statically parse ros/deploy.sh's rsync sources --
# none of which are otherwise visible inside the container under D-02's two
# mounts above. This mirrors the .env.example precedent (one additional,
# narrowly-justified mount so the container's only real execution path,
# run.sh test, can actually run the guard it exists to run) but needs
# write access too: the guard's own fail-first boundary demonstration has
# to create a temporary probe file one directory level outside the
# experiment (a sibling under experiments/, not inside wojtek_rai_v1/) to
# prove the scan actually catches a real violation there, and no other
# mount reaches that path. Marginal risk over the mounts this service
# already carries is small: the container is already privileged (see
# `privileged: true` above in the base compose file) with direct host
# /dev, ~/.ssh (ro) and a read-write ros/src mount; this adds one more
# read-write view of the same host checkout, used only by this test suite.
services:
  wojtek_robot:
    volumes:
      - ../../experiments/wojtek_rai_v1:/ros2_ws/experiments/wojtek_rai_v1
      - ../../.env.example:/ros2_ws/.env.example:ro
      - ../..:/ros2_ws/repo_root
